<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — 오브제 스토어</title>
    <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
    <div id="shop-header"></div>
    <main id="main-content">
        <div class="page-width account-page">
            <div class="account-intro">
                <p class="eyebrow">JOIN THE SHOP</p>
                <h1>본인인증으로<br>안전하게 시작해요.</h1>
                <p>휴대폰 본인인증을 마친 분만 가입할 수 있어요. 인증한 이름과 휴대폰 번호가 회원 정보와 주문자 정보로 그대로 쓰입니다. 한 사람은 한 계정만 만들 수 있어요.</p>
                <span class="account-decoration" aria-hidden="true">hello.</span>
            </div>
            <div class="account-form-wrap">
                <ol class="steps" id="steps">
                    <li data-step="1"><span>01</span>본인인증</li>
                    <li data-step="2"><span>02</span>계정 정보</li>
                    <li data-step="3"><span>03</span>가입 완료</li>
                </ol>
                <div id="step-root" aria-live="polite"></div>
                <div class="account-help">
                    <p>이미 회원이신가요? <a id="login-link" href="/auth/login.html">로그인</a></p>
                    <p>본인인증 정보는 회원 확인과 중복 가입 방지에만 쓰며, 식별값은 복원할 수 없는 형태로만 보관합니다.</p>
                </div>
            </div>
        </div>
    </main>
    <div id="shop-footer"></div>
    <script type="module">
        import { Bootpay } from '@bootpay/client-js'
        import { IDENTITY_PG, api, loadPgClient, errorHtml, escapeHtml, icon, renderShell, safeNext, saveUser } from '/shop/shop.js'

        renderShell('register')
        const next = safeNext(new URLSearchParams(location.search).get('next'))
        document.getElementById('login-link').href = `/auth/login.html?${new URLSearchParams({ next })}`
        const root = document.getElementById('step-root')
        const state = { step: 1, busy: false, error: '', duplicateEmail: '', token: '', identity: null, user: null }

        function setSteps() {
            document.querySelectorAll('#steps li').forEach(li => {
                const step = Number(li.dataset.step)
                li.className = step === state.step ? 'active' : step < state.step ? 'done' : ''
                li.setAttribute('aria-current', step === state.step ? 'step' : 'false')
            })
        }

        function formatPhone(phone) {
            const digits = String(phone || '')
            return digits.length === 11 ? `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}` : digits
        }

        function render() {
            setSteps()
            if (state.step === 1) {
                root.innerHTML = `<div class="verify-box">
                    <h2>휴대폰 본인인증</h2>
                    <p>본인 명의 휴대폰으로 인증해 주세요. 인증 창은 Bootpay 가 띄우며, 이 쇼핑몰은 인증 결과를 서버에서 다시 확인합니다.</p>
                    <button type="button" class="button button-dark button-full" id="verify" ${state.busy ? 'disabled' : ''}>${state.busy ? '인증 결과 확인 중…' : '휴대폰 본인인증 하기'} <span aria-hidden="true">${icon('arrow-up-right')}</span></button>
                </div>
                ${state.duplicateEmail ? `<div class="error-notice" role="alert"><p>이미 가입된 회원이에요 (${escapeHtml(state.duplicateEmail)}). 기존 계정으로 로그인해 주세요.</p><a class="text-link" href="/auth/login.html?${new URLSearchParams({ next })}">로그인하기</a></div>` : state.error ? errorHtml(state.error) : ''}`
                document.getElementById('verify').addEventListener('click', verifyIdentity)
                return
            }
            if (state.step === 2) {
                const identity = state.identity
                root.innerHTML = `
                    <div class="verified-card"><span class="badge-check" aria-hidden="true">${icon('check')}</span><div><strong>${escapeHtml(identity.name || '인증 완료')}</strong> 님, 본인인증이 완료됐어요.<p>${escapeHtml(formatPhone(identity.phone))}${identity.birth ? ` · ${escapeHtml(identity.birth)}` : ''}</p></div></div>
                    <form id="register-form" novalidate>
                        <div class="form-field"><label for="name">이름</label><input id="name" value="${escapeHtml(identity.name)}" readonly><small>본인인증 결과로 확정된 값이라 수정할 수 없어요.</small></div>
                        <div class="form-field"><label for="phone">휴대폰</label><input id="phone" value="${escapeHtml(formatPhone(identity.phone))}" readonly></div>
                        <div class="form-field"><label for="email">이메일 (아이디)</label><input id="email" name="email" type="email" autocomplete="email" required></div>
                        <div class="form-field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><small>8자 이상</small></div>
                        <div class="form-field"><label for="password-confirm">비밀번호 확인</label><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required></div>
                        <label class="checkbox-row" style="margin-bottom:22px"><input type="checkbox" id="agree" required> 이용약관과 개인정보 수집·이용에 동의합니다. (필수)</label>
                        ${state.error ? errorHtml(state.error) : ''}
                        <button type="submit" class="button button-dark button-full" ${state.busy ? 'disabled' : ''}>${state.busy ? '가입하는 중…' : '가입하기'} <span aria-hidden="true">${icon('arrow-right')}</span></button>
                    </form>`
                document.getElementById('register-form').addEventListener('submit', register)
                return
            }
            root.innerHTML = `<div class="verify-box">
                <h2>${escapeHtml(state.user.username)}님, 환영해요.</h2>
                <p>가입과 로그인이 끝났어요. 담아둔 상품이 있다면 이어서 주문할 수 있습니다.</p>
                <a class="button button-dark button-full" href="${escapeHtml(next)}">쇼핑 계속하기 <span aria-hidden="true">${icon('arrow-up-right')}</span></a>
            </div>`
        }

        async function verifyIdentity() {
            if (state.busy) return
            state.error = ''
            state.duplicateEmail = ''
            let response
            try {
                // client_key 와 SDK 환경 모드는 서버가 정한 값으로 맞춘다 (개발 키는 개발 모드에서만 인식된다).
                const pg = await loadPgClient()
                Bootpay.setEnvironmentMode(pg.mode)
                response = await Bootpay.requestAuthentication({
                    client_key: pg.clientKey,
                    // authentication_id 가 없으면 RC_O_ID_BLANK 로 창이 바로 닫힌다.
                    authentication_id: `shop_signup_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`,
                    pg: IDENTITY_PG,
                    order_name: '회원가입 본인인증',
                    // iframe 이 아니면 일부 환경이 redirect 모드로 바뀌어 RC_REDIRECT_URL_INVALID 가 난다.
                    extra: { open_type: 'iframe', display_error_result: true }
                })
            } catch (error) {
                // 창을 닫으면 event: 'cancel' 로 throw 된다 — 실패가 아니라 조용히 돌아간다.
                if (error?.event !== 'cancel') {
                    state.error = error?.message || error?.error_message || '본인인증 창을 열지 못했습니다.'
                    render()
                }
                return
            }
            // receipt_id 는 response.data 안에 온다.
            const receiptId = response?.data?.receipt_id ?? response?.receipt_id
            if (!['done', 'confirm'].includes(response?.event) || !receiptId) {
                state.error = '본인인증이 완료되지 않았습니다. 다시 시도해 주세요.'
                render()
                return
            }
            try { Bootpay.destroy() } catch {}

            state.busy = true
            render()
            try {
                const result = await api('/api/auth/identity', { method: 'POST', body: { receipt_id: receiptId } })
                Object.assign(state, { step: 2, token: result.verification_token, identity: result.identity })
            } catch (error) {
                if (error.code === 'IDENTITY_ALREADY_LINKED') state.duplicateEmail = error.data?.email || '기존 계정'
                else state.error = error.message
            } finally {
                state.busy = false
                render()
            }
        }

        async function register(event) {
            event.preventDefault()
            const form = event.currentTarget
            if (!form.reportValidity()) return
            if (form.password.value !== form.password_confirm.value) {
                state.error = '비밀번호 확인이 일치하지 않습니다.'
                render()
                return
            }
            const email = form.email.value
            const password = form.password.value
            state.busy = true
            state.error = ''
            render()
            try {
                const { user } = await api('/api/auth/register', { method: 'POST', body: { verification_token: state.token, email, password } })
                saveUser(user)
                Object.assign(state, { step: 3, user })
                renderShell('register')
            } catch (error) {
                // 인증 토큰이 만료되면 처음부터 다시 인증한다.
                if (error.code === 'VERIFICATION_REQUIRED') Object.assign(state, { step: 1, token: '', identity: null })
                state.error = error.message
            } finally {
                state.busy = false
                render()
                const emailInput = document.getElementById('email')
                if (emailInput && state.step === 2) emailInput.value = email
            }
        }

        render()
    </script>
</body>
</html>
