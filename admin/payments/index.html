<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 결제내역</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #172033; }
        header { padding: 18px 28px; background: #111827; color: white; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #c7d2fe; text-decoration: none; margin-left: 16px; font-weight: 700; }
        main { max-width: 1240px; margin: 36px auto; padding: 0 20px; }
        .panel { background: white; border-radius: 16px; padding: 26px; box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08); }
        .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        h1 { margin: 0; }
        p { color: #64748b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
        th { color: #475569; font-size: 13px; background: #f8fafc; }
        input { width: 130px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
        input.reason { width: 190px; }
        button { padding: 8px 11px; border: 0; border-radius: 8px; background: #dc2626; color: white; font-weight: 800; cursor: pointer; }
        button.secondary { background: #e2e8f0; color: #172033; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
        .pending { background: #fef3c7; color: #92400e; }
        .paid { background: #dcfce7; color: #166534; }
        .cancelled { background: #fee2e2; color: #991b1b; }
        .price_mismatch { background: #ffedd5; color: #9a3412; }
        code { font-size: 12px; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
        .message { margin-bottom: 16px; padding: 12px; border-radius: 10px; display: none; }
        .message.show { display: block; }
        .message.ok { background: #dcfce7; color: #166534; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .empty { padding: 24px; text-align: center; color: #64748b; }
    </style>
</head>
<body>
    <header>
        <strong>관리자</strong>
        <nav>
            <a href="/admin/users/index.html">회원</a>
            <a href="/admin/payments/index.html">결제내역</a>
            <a href="/npm/widget/widget.html">결제 데모</a>
            <a href="/">메인</a>
        </nav>
    </header>
    <main>
        <div id="message" class="message"></div>
        <section class="panel">
            <div class="toolbar">
                <div>
                    <h1>결제내역 관리</h1>
                    <p>주문/결제 내역을 조회하고 결제 취소를 요청합니다. Cloudflare Functions 데모는 메모리 취소만, Express 서버는 Bootpay 키가 있으면 실제 취소를 시도합니다.</p>
                </div>
                <button class="secondary" id="refresh">새로고침</button>
            </div>
            <div id="content" class="empty">불러오는 중...</div>
        </section>
    </main>
    <script>
        const message = document.getElementById('message')
        const content = document.getElementById('content')
        const currentUser = JSON.parse(localStorage.getItem('bootpay_demo_user') || 'null')

        function showMessage(text, type) {
            message.textContent = text
            message.className = `message show ${type}`
        }
        function requireAdmin() {
            if (!currentUser || currentUser.role !== 'admin') {
                content.innerHTML = '<p>관리자 로그인이 필요합니다. 데모 관리자 계정은 admin@demo.local / admin1234 입니다.</p><p><a href="/auth/login.html">로그인으로 이동</a></p>'
                return false
            }
            return true
        }
        async function loadPayments() {
            if (!requireAdmin()) return
            const response = await fetch('/api/admin/payments', { headers: { 'X-Demo-Admin-Id': currentUser.id } })
            const data = await response.json()
            if (!data.success) {
                showMessage(data.message || '결제내역을 불러오지 못했습니다.', 'error')
                return
            }
            if (!data.payments.length) {
                content.innerHTML = '<div class="empty">결제내역이 없습니다. 결제 데모에서 주문을 생성해 주세요.</div>'
                return
            }
            content.innerHTML = `
                <table>
                    <thead><tr><th>주문</th><th>회원</th><th>금액</th><th>상태</th><th>영수증</th><th>생성일</th><th>취소</th></tr></thead>
                    <tbody>${data.payments.map(payment => renderPayment(payment)).join('')}</tbody>
                </table>`
            content.querySelectorAll('button[data-order-id]').forEach(button => {
                button.addEventListener('click', () => cancelPayment(button.dataset.orderId))
            })
        }
        function renderPayment(payment) {
            const disabled = payment.status === 'cancelled' ? 'disabled' : ''
            const user = payment.user || payment.user_id ? `${escapeHtml(payment.user?.email || payment.user_id)}` : '비회원'
            return `<tr>
                <td><strong>${escapeHtml(payment.product_name || payment.order_name || payment.order_id)}</strong><br><code>${escapeHtml(payment.order_id)}</code></td>
                <td>${user}</td>
                <td>₩${Number(payment.total_price || payment.price || 0).toLocaleString()}</td>
                <td><span class="badge ${escapeHtml(payment.status || 'pending')}">${statusLabel(payment.status)}</span>${payment.cancelled_at ? `<br><small>${formatDate(payment.cancelled_at)}</small>` : ''}</td>
                <td>${payment.receipt_id ? `<code>${escapeHtml(payment.receipt_id)}</code>` : '-'}</td>
                <td>${formatDate(payment.created_at)}</td>
                <td>
                    <input class="reason" data-reason-for="${payment.order_id}" placeholder="취소 사유" value="관리자 취소" ${disabled}>
                    <input data-price-for="${payment.order_id}" type="number" min="0" placeholder="취소금액" value="${Number(payment.total_price || payment.price || 0)}" ${disabled}>
                    <button data-order-id="${payment.order_id}" ${disabled}>취소</button>
                </td>
            </tr>`
        }
        async function cancelPayment(orderId) {
            const reason = content.querySelector(`[data-reason-for="${CSS.escape(orderId)}"]`)?.value || '관리자 취소'
            const cancel_price = content.querySelector(`[data-price-for="${CSS.escape(orderId)}"]`)?.value || undefined
            if (!window.confirm(`${orderId} 결제를 취소 처리할까요?`)) return
            const response = await fetch(`/api/admin/payments/${encodeURIComponent(orderId)}/cancel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Demo-Admin-Id': currentUser.id },
                body: JSON.stringify({ reason, cancel_price })
            })
            const data = await response.json()
            if (!data.success) {
                showMessage(data.message || '취소 처리에 실패했습니다.', 'error')
                return
            }
            showMessage(data.message || '취소 처리했습니다.', 'ok')
            await loadPayments()
        }
        function statusLabel(status) {
            return { pending: '대기', awaiting_deposit: '입금대기', paid: '결제완료', cancelled: '취소됨', price_mismatch: '금액불일치' }[status] || status || '대기'
        }
        function escapeHtml(value) {
            const div = document.createElement('div')
            div.textContent = value == null ? '' : String(value)
            return div.innerHTML
        }
        function formatDate(value) {
            return value ? new Date(value).toLocaleString('ko-KR') : '-'
        }
        document.getElementById('refresh').addEventListener('click', loadPayments)
        loadPayments()
    </script>
</body>
</html>
