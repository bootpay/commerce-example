<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역 — 오브제 데모샵</title>
    <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
    <div id="shop-header"></div>
    <main id="main-content">
        <div class="page-width standard-page">
            <div class="page-title"><p class="eyebrow">MY ORDERS</p><h1>주문 내역</h1><p id="account-summary"></p></div>
            <div id="orders-root"></div>
        </div>
    </main>
    <div id="shop-footer"></div>
    <script type="module">
        import { api, artFor, currentUser, errorHtml, escapeHtml, loadingHtml, loginPath, money, renderShell } from '../shop.js'

        renderShell('orders')
        const user = currentUser()
        const root = document.getElementById('orders-root')
        const STATUS = { paid: '결제 완료', pending: '결제 대기', cancelled: '결제 취소', price_mismatch: '금액 확인 필요' }

        async function load() {
            root.innerHTML = loadingHtml('주문 내역을 불러오고 있습니다.')
            try {
                const { orders } = await api(`/api/shop/orders?user_id=${encodeURIComponent(user.id)}`)
                if (!orders.length) {
                    root.innerHTML = `<div class="empty-state"><h2>아직 주문한 물건이 없어요.</h2><p>마음에 드는 물건을 찾아 첫 주문을 해 보세요.</p><a href="/shop/products/index.html#collection" class="button button-dark">상품 둘러보기</a></div>`
                    return
                }
                root.innerHTML = `<div class="order-history">${orders.map(order => `
                    <article class="order-row">
                        <div class="order-row-photo">${artFor(order.items?.[0]?.productId || order.product_id)}</div>
                        <div class="order-row-info">
                            <div class="order-row-meta"><span class="order-status ${order.status === 'paid' ? 'is-paid' : order.status === 'cancelled' ? 'is-cancelled' : ''}">${escapeHtml(STATUS[order.status] || order.status)}</span><span>${new Date(order.created_at).toLocaleString('ko-KR')}</span></div>
                            <h2>${escapeHtml(order.order_name || order.product_name)}</h2>
                            <p class="muted">주문번호 ${escapeHtml(order.order_id)}</p>
                        </div>
                        <div class="order-row-actions"><strong>${money(order.total_price)}</strong><a class="text-link" href="/shop/orders/complete.html?order_id=${encodeURIComponent(order.order_id)}">상세 보기</a></div>
                    </article>`).join('')}</div>`
            } catch (error) {
                root.innerHTML = errorHtml(error.message, 'retry')
                document.getElementById('retry')?.addEventListener('click', load)
            }
        }

        if (!user) {
            location.replace(loginPath())
        } else {
            document.getElementById('account-summary').textContent = `${user.username}님${user.identity_verified ? ' · 본인인증 완료' : ''} · ${user.email}`
            load()
        }
    </script>
</body>
</html>
