<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역 — 오브제 스토어</title>
    <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
    <div id="shop-header"></div>
    <main id="main-content">
        <div class="page-width standard-page">
            <div class="page-title"><p class="eyebrow">MY ORDERS</p><h1>주문 내역</h1><p id="account-summary"></p></div>
            <div id="orders-root"></div>
        </div>
    </main>
    <div id="shop-footer"></div>
    <script type="module">
        import { ORDER_STATUS_CLASS, api, artFor, currentUser, errorHtml, escapeHtml, loadingHtml, loginPath, money, orderStatusLabel, renderShell, shortTime } from '../shop.js'

        renderShell('orders')
        const user = currentUser()
        const root = document.getElementById('orders-root')
        // 입금을 기다리는 주문이 있으면 이 화면도 저절로 바뀐다 — 뱅크알람이 입금을 확인하면 웹훅 · 조회로 상태가 넘어온다
        const POLL_MS = 15000
        let pollTimer = null

        // 무통장 주문은 상태 한 줄을 더 든다 — 지금 무엇을 기다리는지, 언제 확인됐는지
        function depositLine(order) {
            if (order.method !== 'bank_transfer') return ''
            const bank = order.bank_transfer || {}
            const account = bank.account ? `${bank.account.bank_name} ${bank.account.account_no}` : ''
            if (order.status === 'awaiting_deposit') {
                return `입금자 ${escapeHtml(bank.depositor || '')}${account ? ` · ${escapeHtml(account)}` : ''} · 입금하면 자동으로 확인돼요`
            }
            if (order.status === 'paid') {
                const received = bank.deposit?.received_at || order.paid_at
                return `입금 확인 ${escapeHtml(shortTime(received))}${bank.deposit?.bank_name ? ` · ${escapeHtml(bank.deposit.bank_name)}` : ''}`
            }
            if (order.status === 'price_mismatch') return '입금 금액이 주문과 달라 판매자가 확인하고 있어요'
            return ''
        }

        async function load({ quiet = false } = {}) {
            if (!quiet) root.innerHTML = loadingHtml('주문 내역을 불러오고 있습니다.')
            try {
                const { orders } = await api(`/api/shop/orders?user_id=${encodeURIComponent(user.id)}`)
                if (!orders.length) {
                    root.innerHTML = `<div class="empty-state"><h2>아직 주문한 물건이 없어요.</h2><p>마음에 드는 물건을 찾아 첫 주문을 해 보세요.</p><a href="/shop/products/index.html#collection" class="button button-dark">상품 둘러보기</a></div>`
                    return
                }
                root.innerHTML = `<div class="order-history">${orders.map(order => {
                    const line = depositLine(order)
                    return `
                    <article class="order-row">
                        <div class="order-row-photo">${artFor(order.items?.[0]?.productId || order.product_id)}</div>
                        <div class="order-row-info">
                            <div class="order-row-meta"><span class="order-status ${ORDER_STATUS_CLASS[order.status] || ''}">${escapeHtml(orderStatusLabel(order))}</span><span>${order.method === 'bank_transfer' ? '무통장 입금 · ' : ''}${new Date(order.created_at).toLocaleString('ko-KR')}</span></div>
                            <h2>${escapeHtml(order.order_name || order.product_name)}</h2>
                            <p class="muted">주문번호 ${escapeHtml(order.order_id)}</p>
                            ${line ? `<p class="order-row-deposit">${line}</p>` : ''}
                        </div>
                        <div class="order-row-actions"><strong>${money(order.total_price)}</strong><a class="text-link" href="/shop/orders/complete.html?order_id=${encodeURIComponent(order.order_id)}">${order.status === 'awaiting_deposit' ? '입금 안내' : '상세 보기'}</a></div>
                    </article>`
                }).join('')}</div>`
                schedule(orders)
            } catch (error) {
                if (quiet) return schedule([{ status: 'awaiting_deposit' }]) // 기다리는 중의 조회 실패는 화면을 깨지 않고 다음 차례에 다시 본다
                root.innerHTML = errorHtml(error.message, 'retry')
                document.getElementById('retry')?.addEventListener('click', () => load())
            }
        }

        function schedule(orders) {
            clearTimeout(pollTimer)
            if (orders.some(order => ['awaiting_deposit', 'price_mismatch'].includes(order.status))) pollTimer = setTimeout(() => load({ quiet: true }), POLL_MS)
        }
        // 다른 탭(은행 앱)에서 돌아오면 바로 다시 본다
        document.addEventListener('visibilitychange', () => { if (!document.hidden && user) load({ quiet: true }) })

        if (!user) {
            location.replace(loginPath())
        } else {
            document.getElementById('account-summary').textContent = `${user.username}님${user.identity_verified ? ' · 본인인증 완료' : ''} · ${user.email}`
            load()
        }
    </script>
</body>
</html>
