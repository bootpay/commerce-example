<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 결과 — 오브제 스토어</title>
    <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
    <div id="shop-header"></div>
    <main id="main-content"><div class="page-width result-page" id="result-root"></div></main>
    <div id="shop-footer"></div>
    <script type="module">
        import { api, bindCopyButtons, currentUser, errorHtml, escapeHtml, icon, loadingHtml, money, orderStatusLabel, renderShell, shortTime, subtractFromCart } from '../shop.js'

        renderShell()
        const root = document.getElementById('result-root')
        const orderId = new URLSearchParams(location.search).get('order_id') || ''
        const user = currentUser()
        // 입금을 기다리는 동안 몇 초마다 다시 본다 — 서버가 그때마다 부트페이에 입금 여부를 묻는다
        const POLL_MS = 5000
        let pollTimer = null
        let shown = ''

        const detailsHtml = rows => `<dl class="result-details">${rows.map(([label, value, copy]) => `
            <div><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}${copy ? ` <button type="button" class="copy-button" data-copy="${escapeHtml(copy)}">복사</button>` : ''}</dd></div>`).join('')}</dl>`

        // 무통장 주문의 진행 — 주문 접수 → 입금 확인 → 배송 준비. 지금 단계만 굵게
        function stepsHtml(order) {
            if (order.method !== 'bank_transfer' || !['awaiting_deposit', 'paid'].includes(order.status)) return ''
            const at = order.status === 'paid' ? 2 : 1
            const steps = ['주문 접수', '입금 확인', '배송 준비']
            return `<ol class="order-steps" aria-label="주문 진행">${steps.map((name, i) => `
                <li class="${i < at ? 'is-done' : i === at ? 'is-current' : ''}"${i === at ? ' aria-current="step"' : ''}>${i < at ? icon('check', 13) : ''}${escapeHtml(name)}</li>`).join('')}</ol>`
        }

        function headline(order) {
            const bank = order.method === 'bank_transfer'
            switch (order.status) {
                case 'paid': return ['주문이 완료되었습니다.', bank ? '입금이 확인되었습니다. 출고가 시작되면 휴대폰으로 알려 드릴게요.' : '주문해 주셔서 감사합니다. 출고가 시작되면 휴대폰으로 알려 드릴게요.']
                case 'awaiting_deposit': return [order.bank_transfer?.deadline_label ? `${order.bank_transfer.deadline_label} 안에 아래 계좌로 입금해 주세요.` : '아래 계좌로 입금해 주세요.', '입금자명과 금액이 주문과 같으면 입금이 자동으로 확인돼요. 기한이 지나면 주문이 자동으로 취소돼요.']
                case 'price_mismatch': return ['입금 금액을 확인하고 있어요.', '들어온 금액이 주문 금액과 달라요. 판매자가 확인한 뒤 연락드릴게요.']
                case 'cancelled': return ['주문이 취소되었습니다.', order.cancel_reason ? `취소 사유: ${order.cancel_reason}` : (bank && !order.paid_at ? '입금 전에 취소된 주문이에요.' : '결제가 취소되었습니다.')]
                default: return ['결제를 확인하고 있어요.', '결제 완료가 서버에서 아직 확인되지 않았습니다. 잠시 후 주문 내역에서 다시 확인해 주세요.']
            }
        }

        function render(order) {
            const paid = order.status === 'paid'
            const awaiting = order.status === 'awaiting_deposit'
            const bank = order.bank_transfer || {}
            const [title, description] = headline(order)
            const rows = [
                ['주문번호', order.order_id],
                ['주문 상품', order.order_name || order.product_name],
                ['결제 금액', money(order.total_price)],
                ['상태', orderStatusLabel(order)],
                // 무통장은 언제 어느 은행으로 들어왔는지까지 — 손님이 통장 내역과 맞춰 본다
                ...(paid && order.method === 'bank_transfer' ? [['입금 확인', [shortTime(bank.deposit?.received_at || order.paid_at), bank.deposit?.bank_name].filter(Boolean).join(' · ')]] : []),
                ...(order.shipping ? [['배송지', `${order.shipping.address1} ${order.shipping.address2 || ''}`.trim()]] : []),
                ...(order.receipt_id ? [['영수증 ID', order.receipt_id]] : [])
            ].filter(([, value]) => value)
            // 입금 안내는 기다리는 동안만 맨 위에 선다 — 손님이 이 화면에서 할 일이 그것뿐이다. 계좌번호 · 금액은 복사해서 은행 앱에 붙인다
            const deposit = awaiting && bank.account ? [
                ['입금 은행', bank.account.bank_name],
                ['계좌번호', bank.account.account_no, bank.account.account_no.replace(/\D/g, '')],
                ['예금주', bank.account.holder],
                ['입금할 금액', money(order.total_price), String(order.total_price)],
                ['입금자명', bank.depositor],
                ['입금 기한', bank.deadline ? `${shortTime(bank.deadline)}까지` : ''],
                ['안내받을 연락처', [bank.notify_phone, bank.notify_email].filter(Boolean).join(' · ')]
            ].filter(([, value]) => value) : []
            root.innerHTML = `
                <div class="result-symbol ${paid ? '' : 'is-pending'}" aria-hidden="true">${icon(paid ? 'check' : 'clock', 26)}</div>
                <h1>${escapeHtml(title)}</h1>
                <p class="result-description">${escapeHtml(description)}</p>
                ${stepsHtml(order)}
                ${deposit.length ? detailsHtml(deposit) : ''}
                ${awaiting ? `<p class="result-live" role="status">입금을 기다리는 중 · ${escapeHtml(shortTime(new Date()))} 확인</p>` : ''}
                ${detailsHtml(rows)}
                <div class="result-actions">
                    <a class="button button-outline" href="/shop/account/orders.html">주문 내역 보기</a>
                    <a class="button button-dark" href="/shop/products/index.html#collection">계속 쇼핑하기 <span aria-hidden="true">${icon('arrow-up-right')}</span></a>
                </div>`
            bindCopyButtons(root)
        }

        async function load({ quiet = false } = {}) {
            if (!quiet) root.innerHTML = loadingHtml('주문 상태를 확인하고 있습니다.')
            if (!orderId || !user) {
                root.innerHTML = errorHtml('주문 정보를 확인할 수 없습니다. 주문 내역에서 다시 확인해 주세요.') + '<a href="/shop/account/orders.html" class="text-link">주문 내역 보기</a>'
                return
            }
            try {
                const { order } = await api(`/api/shop/orders/${encodeURIComponent(orderId)}?user_id=${encodeURIComponent(user.id)}`)
                // 서버가 결제 완료를 확인한 주문만 장바구니에서 뺀다. 무통장은 주문이 접수된 순간 뺀다 —
                // 입금은 은행 앱에서 하므로 이 화면을 떠났다 돌아오지 않을 수 있다.
                const checkoutKey = `bootpay_shop_checkout:${orderId}`
                const checkout = JSON.parse(sessionStorage.getItem(checkoutKey) || 'null')
                if (['paid', 'awaiting_deposit'].includes(order.status) && checkout) {
                    if (checkout.mode === 'cart') subtractFromCart(checkout.items)
                    sessionStorage.removeItem(checkoutKey)
                }
                // 바뀐 것이 없으면 다시 그리지 않는다 — 복사하던 버튼 · 고르던 글자가 5초마다 사라지지 않게. 확인 시각만 고친다
                const json = JSON.stringify(order)
                if (json !== shown) render(order)
                else root.querySelector('.result-live')?.replaceChildren(`입금을 기다리는 중 · ${shortTime(new Date())} 확인`)
                shown = json
                // 금액 확인 필요도 판매자가 바로잡으면 바뀌므로 계속 본다
                schedule(['awaiting_deposit', 'price_mismatch'].includes(order.status))
            } catch (error) {
                // 기다리는 중의 조회 실패는 화면을 깨지 않고 다음 차례에 다시 본다
                if (quiet) return schedule(true)
                shown = ''
                root.innerHTML = errorHtml(error.status === 404 ? '이 계정에서 만든 주문을 찾지 못했습니다. 주문 내역에서 다시 확인해 주세요.' : error.message, 'retry') + '<a href="/shop/account/orders.html" class="text-link">주문 내역 보기</a>'
                document.getElementById('retry')?.addEventListener('click', () => load())
            }
        }

        function schedule(waiting) {
            clearTimeout(pollTimer)
            if (waiting) pollTimer = setTimeout(() => load({ quiet: true }), POLL_MS)
        }
        // 은행 앱에서 입금하고 돌아오면 바로 다시 본다
        document.addEventListener('visibilitychange', () => { if (!document.hidden && pollTimer) load({ quiet: true }) })
        load()
    </script>
</body>
</html>
