<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문서 — 오브제 스토어</title>
    <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
    <div id="shop-header"></div>
    <main id="main-content">
        <div class="page-width standard-page">
            <div class="page-title"><p class="eyebrow">CHECKOUT</p><h1>주문서</h1><p>주문 상품과 배송지를 확인한 뒤 결제해 주세요.</p></div>
            <div id="order-root"></div>
        </div>
    </main>
    <div id="shop-footer"></div>
    <script type="module">
        import { Bootpay } from '@bootpay/client-js'
        import { SHOP_COUPONS, findShopProduct } from '../catalog.js'
        import { api, artFor, loadPgClient, currentUser, errorHtml, escapeHtml, getBuyNow, getCart, icon, loadingHtml, loginPath, money, renderShell } from '../shop.js'

        renderShell()
        const root = document.getElementById('order-root')
        const mode = new URLSearchParams(location.search).get('mode') === 'buy-now' ? 'buy-now' : 'cart'
        const user = currentUser()
        const items = mode === 'buy-now' ? [getBuyNow()].filter(Boolean) : getCart()
        const state = { couponCode: '', quote: null, quoteError: '', busy: false, payError: '', method: 'card' }
        let quoteSeq = 0

        if (!user) {
            location.replace(loginPath())
        } else if (!items.length) {
            root.innerHTML = `<div class="empty-state"><h2>주문할 상품이 없어요.</h2><p>${mode === 'buy-now' ? '상품 상세에서 바로 구매를 다시 눌러 주세요.' : '장바구니가 비어 있습니다.'}</p><a href="/shop/products/index.html#collection" class="button button-dark">상품 둘러보기</a></div>`
        } else {
            renderForm()
            refreshQuote()
        }

        function renderForm() {
            root.innerHTML = `<div class="cart-layout">
                <form id="order-form" novalidate>
                    <section class="form-section"><h2>주문 상품 <small>${mode === 'buy-now' ? '바로 구매 · 장바구니는 그대로 유지됩니다' : '장바구니 전체'}</small></h2><div id="order-lines"></div></section>
                    <section class="form-section">
                        <h2>주문자 정보 <small>${user.identity_verified ? '본인인증으로 확인된 정보입니다' : ''}</small></h2>
                        <div class="form-grid">
                            <div class="form-field"><label for="buyer-name">이름</label><input id="buyer-name" value="${escapeHtml(user.username || '')}" readonly></div>
                            <div class="form-field"><label for="buyer-phone">휴대폰</label><input id="buyer-phone" value="${escapeHtml(user.phone || '')}" readonly></div>
                            <div class="form-field span-2"><label for="buyer-email">이메일</label><input id="buyer-email" value="${escapeHtml(user.email || '')}" readonly></div>
                        </div>
                    </section>
                    <section class="form-section">
                        <h2>배송지</h2>
                        <div class="form-grid">
                            <div class="form-field"><label for="receiver">받는 분</label><input id="receiver" name="receiver" autocomplete="name" value="${escapeHtml(user.username || '')}" required></div>
                            <div class="form-field"><label for="receiver-phone">연락처</label><input id="receiver-phone" name="receiver_phone" autocomplete="tel" inputmode="tel" value="${escapeHtml(user.phone || '')}" required></div>
                            <div class="form-field"><label for="zipcode">우편번호</label><input id="zipcode" name="zipcode" autocomplete="postal-code" inputmode="numeric" placeholder="06236" value="${escapeHtml(user.address?.zipcode || '')}" required></div>
                            <div class="form-field"><label for="address1">주소</label><input id="address1" name="address1" autocomplete="address-line1" placeholder="서울 강남구 테헤란로" value="${escapeHtml(user.address?.address1 || '')}" required></div>
                            <div class="form-field span-2"><label for="address2">상세 주소</label><input id="address2" name="address2" autocomplete="address-line2" placeholder="동·호수" value="${escapeHtml(user.address?.address2 || '')}"></div>
                            <div class="form-field span-2"><label for="memo">배송 메모</label><select id="memo" name="memo"><option value="">선택 안 함</option><option>문 앞에 놓아 주세요</option><option>경비실에 맡겨 주세요</option><option>배송 전 연락 부탁드립니다</option></select></div>
                        </div>
                    </section>
                    <section class="form-section">
                        <h2>쿠폰</h2>
                        <div class="form-field"><label for="coupon">보유 쿠폰</label><select id="coupon"><option value="">사용 안 함</option>${Object.entries(SHOP_COUPONS).map(([code, coupon]) => `<option value="${code}">${escapeHtml(coupon.name)}${coupon.minSubtotal ? ` (${money(coupon.minSubtotal)} 이상)` : ''}</option>`).join('')}</select><small id="coupon-help"></small></div>
                    </section>
                    <section class="form-section">
                        <h2>결제 수단</h2>
                        <div class="method-options" role="radiogroup" aria-label="결제 수단">
                            <label class="checkbox-row"><input type="radio" name="method" value="card" checked> 카드 · 간편결제</label>
                            <label class="checkbox-row"><input type="radio" name="method" value="bank_transfer"> 무통장 입금</label>
                        </div>
                        <div id="bank-transfer-fields" hidden>
                            <div class="form-field" id="bank-account-field"><label>입금 은행</label><div class="method-options" id="bank-accounts" role="radiogroup" aria-label="입금 은행"><small>입금 계좌를 불러오고 있어요.</small></div><small>계좌번호는 주문을 마치면 바로 알려 드려요.</small></div>
                            <div class="form-field"><label for="depositor">입금자명</label><input id="depositor" name="depositor" maxlength="50" value="${escapeHtml(user.username || '')}"><small>통장에 찍히는 이름과 같아야 입금이 자동으로 확인돼요. 금액도 주문 금액과 같게 보내 주세요.</small></div>
                        </div>
                    </section>
                    <section class="form-section" style="border-bottom:0">
                        <label class="checkbox-row"><input type="checkbox" id="agree" required> 주문 상품과 결제 금액을 확인했으며, 결제 진행에 동의합니다.</label>
                    </section>
                </form>
                <aside class="order-summary" aria-label="결제 금액"><div id="summary"></div></aside>
            </div>`
            document.getElementById('coupon').addEventListener('change', event => { state.couponCode = event.target.value; refreshQuote() })
            document.querySelectorAll('input[name="method"]').forEach(input => input.addEventListener('change', event => {
                state.method = event.target.value
                const bank = state.method === 'bank_transfer'
                document.getElementById('bank-transfer-fields').hidden = !bank
                document.getElementById('depositor').required = bank
                if (bank) loadBankAccounts()
                paint(false)
            }))
        }

        // 판매자가 부트페이에 등록한 입금 계좌 — 은행 이름과 끝 네 자리만 온다. 하나뿐이면 고를 것 없이 그 계좌다.
        let bankAccountsLoaded = false
        async function loadBankAccounts() {
            if (bankAccountsLoaded) return
            const box = document.getElementById('bank-accounts')
            try {
                const { accounts } = await api('/api/shop/bank-accounts')
                bankAccountsLoaded = true
                if (!accounts.length) {
                    box.innerHTML = '<small>판매자 입금 계좌가 아직 없어요.</small>'
                    return
                }
                // 하나면 고를 것이 없다 — 칸 자체를 숨기고 그 계좌로 주문한다 (은행 · 계좌번호는 입금 안내에서 알려 준다)
                if (accounts.length === 1) {
                    box.innerHTML = `<input type="hidden" name="bank_account" value="${escapeHtml(accounts[0].id)}">`
                    document.getElementById('bank-account-field').hidden = true
                    return
                }
                // 여럿이면 은행 이름으로 고른다. 같은 은행이 둘 이상일 때만 끝 네 자리로 가른다
                const sameBank = name => accounts.filter(row => row.bank_name === name).length > 1
                box.innerHTML = accounts.map((account, i) => `<label class="checkbox-row"><input type="radio" name="bank_account" value="${escapeHtml(account.id)}"${i === 0 ? ' checked' : ''}> ${escapeHtml(account.bank_name)}${sameBank(account.bank_name) ? ` <span class="muted">···${escapeHtml(account.tail)}</span>` : ''}</label>`).join('')
            } catch {
                box.innerHTML = '<small>입금 계좌를 불러오지 못했어요. 주문하면 대표 계좌로 안내해 드려요.</small>'
            }
        }

        async function refreshQuote() {
            const seq = ++quoteSeq
            state.quoteError = ''
            paint(true)
            try {
                const { quote } = await api('/api/shop/quote', { method: 'POST', body: { items, coupon_code: state.couponCode } })
                if (seq !== quoteSeq) return
                state.quote = quote
            } catch (error) {
                if (seq !== quoteSeq) return
                state.quote = null
                state.quoteError = error.message
            }
            paint(false)
        }

        function paint(loading) {
            const quote = state.quote
            document.getElementById('order-lines').innerHTML = items.map(item => {
                const line = quote?.lines.find(value => value.productId === item.productId && (value.optionId || '') === (item.optionId || ''))
                const product = findShopProduct(item.productId)
                return `<div class="order-line"><div class="order-line-photo">${artFor(item.productId)}</div><div class="order-line-info">${escapeHtml(line?.name || product?.name || '상품')}<p>${line?.optionName ? `${escapeHtml(line.optionName)} · ` : ''}${item.quantity}개</p>${line?.problem ? `<p style="color:var(--danger)">${escapeHtml(line.problem)}</p>` : ''}</div><strong>${line ? money(line.subtotal) : '—'}</strong></div>`
            }).join('')
            document.getElementById('coupon-help').textContent = quote?.couponError || (quote?.discount ? `${money(quote.discount)} 할인됩니다.` : '')
            const blocked = !quote?.canCheckout || state.busy
            document.getElementById('summary').innerHTML = `
                <p class="eyebrow">PAYMENT</p><h2>결제 금액</h2>
                <dl>
                    <div><dt>상품 금액</dt><dd>${quote ? money(quote.subtotal) : '—'}</dd></div>
                    <div><dt>쿠폰 할인</dt><dd>${quote?.discount ? `-${money(quote.discount)}` : '0원'}</dd></div>
                    <div><dt>배송비</dt><dd>${quote ? (quote.deliveryFee ? money(quote.deliveryFee) : '무료') : '—'}</dd></div>
                    <div class="summary-total"><dt>총 결제 금액</dt><dd>${quote ? money(quote.total) : '—'}</dd></div>
                </dl>
                ${loading ? loadingHtml('금액을 확인하고 있습니다.') : ''}
                ${state.quoteError ? errorHtml(state.quoteError, 'retry-quote') : ''}
                ${quote && !quote.canCheckout && !quote.couponError ? errorHtml(mode === 'cart' ? '구매할 수 없는 상품이 있어요. 장바구니에서 정리해 주세요.' : '지금 구매할 수 없는 상품이에요.') : ''}
                ${state.payError ? errorHtml(state.payError) : ''}
                <button type="button" id="pay" class="button button-dark button-full" ${blocked || loading ? 'disabled' : ''}>${state.method === 'bank_transfer'
                    ? (state.busy ? '주문 접수 중…' : `${quote ? money(quote.total) : ''} 무통장 입금으로 주문하기`)
                    : (state.busy ? '결제창 여는 중…' : `${quote ? money(quote.total) : ''} 결제하기`)} <span aria-hidden="true">${icon('arrow-up-right')}</span></button>
                <p class="summary-help">${state.method === 'bank_transfer'
                    ? '주문하면 입금 계좌를 알려 드려요. 입금이 확인되면 주문이 자동으로 결제 완료로 바뀝니다.'
                    : '결제하기를 누르면 Bootpay 결제창이 열립니다. 결제 금액은 서버에서 다시 계산합니다.'}</p>
                ${mode === 'cart' ? `<a href="/shop/cart/index.html" class="text-link" style="margin-top:16px"><span aria-hidden="true">${icon('arrow-left')}</span> 장바구니로 돌아가기</a>` : ''}`
            document.getElementById('retry-quote')?.addEventListener('click', refreshQuote)
            document.getElementById('pay').addEventListener('click', pay)
        }

        function shippingFromForm() {
            const form = document.getElementById('order-form')
            const value = name => form.elements[name]?.value.trim() || ''
            return { receiver: value('receiver'), phone: value('receiver_phone').replace(/\D/g, ''), zipcode: value('zipcode'), address1: value('address1'), address2: value('address2'), memo: value('memo') }
        }

        async function pay() {
            if (state.busy) return
            const form = document.getElementById('order-form')
            if (!form.reportValidity()) return
            state.busy = true
            state.payError = ''
            paint(false)
            if (state.method === 'bank_transfer') return orderByBankTransfer()
            try {
                const order = await api('/api/orders', {
                    method: 'POST',
                    body: { items, coupon_code: state.couponCode || undefined, user_id: user.id, shipping: shippingFromForm(), method: 'card', channel: mode }
                })
                // 결제 완료 확인 후 장바구니에서 이 주문서 수량만 빼기 위해 기억해 둔다.
                sessionStorage.setItem(`bootpay_shop_checkout:${order.order_id}`, JSON.stringify({ mode, items }))

                const pg = await loadPgClient()
                Bootpay.setEnvironmentMode(pg.mode)
                const response = await Bootpay.requestPayment({
                    client_key: pg.clientKey,
                    price: order.price,
                    order_name: order.order_name,
                    order_id: order.order_id,
                    method: order.method || 'card',
                    user: { id: user.id, username: user.username, phone: user.phone, email: user.email },
                    extra: { open_type: 'iframe', display_error_result: true }
                })
                if (response.event !== 'done' && response.event !== 'issued') return

                const receiptId = response.data?.receipt_id || response.receipt_id || ''
                const params = new URLSearchParams({ order_id: order.order_id })
                if (receiptId) {
                    await api('/api/orders/verify', { method: 'POST', body: { receipt_id: receiptId, order_id: order.order_id } }).catch(() => null)
                }
                location.href = `/shop/orders/complete.html?${params}`
            } catch (error) {
                state.payError = error?.event === 'cancel' ? '결제를 취소했습니다. 다시 결제하려면 결제하기를 눌러 주세요.' : (error?.message || error?.error_message || '결제에 실패했습니다.')
            } finally {
                state.busy = false
                paint(false)
            }
        }

        // 무통장 입금 — 결제창 없이 주문을 입금대기로 접수하고 입금 안내 화면으로 간다.
        // 서버가 부트페이에 입금대기로 등록하고, 판매자 폰의 뱅크알람이 입금을 읽으면 결제 완료가 된다.
        async function orderByBankTransfer() {
            try {
                const depositor   = document.getElementById('depositor').value.trim()
                const bankAccount = (document.querySelector('input[name="bank_account"]:checked') || document.querySelector('input[type="hidden"][name="bank_account"]'))?.value
                const order = await api('/api/orders', {
                    method: 'POST',
                    body: { items, coupon_code: state.couponCode || undefined, user_id: user.id, shipping: shippingFromForm(), method: 'bank_transfer', depositor, bank_account: bankAccount, channel: mode }
                })
                sessionStorage.setItem(`bootpay_shop_checkout:${order.order_id}`, JSON.stringify({ mode, items }))
                location.href = `/shop/orders/complete.html?${new URLSearchParams({ order_id: order.order_id })}`
            } catch (error) {
                state.payError = error?.message || '주문을 접수하지 못했습니다.'
                state.busy = false
                paint(false)
            }
        }
    </script>
</body>
</html>
