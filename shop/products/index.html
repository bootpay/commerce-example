<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오브제 스토어 — 일상을 채우는 작은 취향</title>
    <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
    <div id="shop-header"></div>
    <main id="main-content">
        <section class="hero" aria-labelledby="hero-heading">
            <div class="hero-copy">
                <p class="eyebrow"><span class="tiny-rule"></span> A LITTLE MORE, EVERYDAY</p>
                <h1 id="hero-heading">일상을 채우는<br><em>작은 취향.</em></h1>
                <p class="hero-description">아침의 주방부터 저녁의 꽃 한 송이까지.<br>오래 곁에 두고 싶은 물건을 모았습니다.</p>
                <a class="button button-dark hero-cta" href="#collection">우리의 물건 만나보기 <span aria-hidden="true" data-icon="arrow-up-right"></span></a>
            </div>
            <a id="hero-photo" class="hero-photo" href="#collection"></a>
        </section>
        <div class="collection-intro"><span>좋아하는 것들로 채운 하루</span><span>FLOWERS · KITCHEN · LIVING · SCENT</span></div>
        <section class="collection page-width" id="collection" aria-labelledby="collection-heading">
            <div class="section-heading">
                <div><p class="eyebrow">THE COLLECTION</p><h2 id="collection-heading">취향이 머무는 곳</h2></div>
                <p>눈길이 가고, 손길이 닿는.<br>나의 일상에 어울리는 물건을 찾아보세요.</p>
            </div>
            <div class="collection-controls">
                <div class="category-tabs" id="category-tabs" aria-label="상품 카테고리"></div>
                <form class="search-form" id="search-form" role="search">
                    <label class="sr-only" for="product-search">상품 검색</label>
                    <input id="product-search" type="search" placeholder="어떤 물건을 찾으세요?">
                    <button type="submit" aria-label="검색"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.7"/></svg></button>
                </form>
            </div>
            <div class="catalog-meta">
                <p id="catalog-count" aria-live="polite"></p>
                <label class="sr-only" for="product-sort">상품 정렬</label>
                <select id="product-sort">
                    <option value="newest">새로 들어온 순</option>
                    <option value="price_asc">낮은 가격순</option>
                    <option value="price_desc">높은 가격순</option>
                </select>
            </div>
            <div id="product-grid"></div>
        </section>
    </main>
    <div id="shop-footer"></div>
    <script type="module">
        import { SHOP_CATEGORIES, categoryName, isAvailable, listShopProducts } from '../catalog.js'
        import { escapeHtml, icon, money, productArt, renderShell } from '../shop.js'

        renderShell('products')
        document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon) })

        const params = new URLSearchParams(window.location.search)
        const state = { categoryId: params.get('category') || '', keyword: params.get('q') || '', sort: params.get('sort') || 'newest' }
        const searchInput = document.getElementById('product-search')
        const sortSelect = document.getElementById('product-sort')
        searchInput.value = state.keyword
        sortSelect.value = state.sort

        const featured = listShopProducts().find(isAvailable)
        document.getElementById('hero-photo').href = `/shop/products/detail.html?product_id=${encodeURIComponent(featured.id)}`
        document.getElementById('hero-photo').innerHTML = `${productArt(featured)}<div class="hero-product-label"><div><span>오늘의 오브제</span><strong>${escapeHtml(featured.name)}</strong></div><span aria-hidden="true">${icon('arrow-up-right', 22)}</span></div>`

        function syncUrl() {
            const next = new URLSearchParams()
            if (state.categoryId) next.set('category', state.categoryId)
            if (state.keyword) next.set('q', state.keyword)
            if (state.sort !== 'newest') next.set('sort', state.sort)
            history.replaceState(null, '', `${location.pathname}${next.toString() ? `?${next}` : ''}${location.hash}`)
        }

        function productCard(product) {
            const href = `/shop/products/detail.html?product_id=${encodeURIComponent(product.id)}`
            const soldOut = !isAvailable(product)
            return `<article class="product-card">
                <a href="${href}" class="product-image" tabindex="-1" aria-hidden="true">${productArt(product, { soldOut })}${soldOut ? '<span class="product-badge">품절</span>' : product.originalPrice > product.price ? '<span class="product-badge">할인</span>' : ''}</a>
                <div class="product-card-meta">
                    <span class="product-category">${escapeHtml(categoryName(product.categoryId))}</span>
                    <a href="${href}"><h3>${escapeHtml(product.name)}</h3></a>
                    <p class="product-card-price">${money(product.price)}${product.originalPrice > product.price ? `<del>${money(product.originalPrice)}</del>` : ''}</p>
                </div>
            </article>`
        }

        function render() {
            document.getElementById('category-tabs').innerHTML = [{ id: '', name: '모든 상품' }, ...SHOP_CATEGORIES].map(category => {
                const active = state.categoryId === category.id
                return `<button type="button" data-category="${escapeHtml(category.id)}" class="${active ? 'active' : ''}" aria-pressed="${active}">${escapeHtml(category.name)}</button>`
            }).join('')
            const products = listShopProducts(state)
            document.getElementById('catalog-count').innerHTML = `총 <strong>${products.length}</strong>개의 물건${state.keyword ? ` · ‘${escapeHtml(state.keyword)}’ 검색 결과` : ''}`
            document.getElementById('product-grid').innerHTML = products.length
                ? `<div class="product-grid">${products.map(productCard).join('')}</div>`
                : `<div class="empty-state"><p class="eyebrow">NO OBJECTS FOUND</p><h3>아직 만나지 못한 물건이에요.</h3><p>검색어나 카테고리를 바꿔 다시 찾아보세요.</p><button type="button" class="button button-outline" id="reset-filter">모든 상품 보기</button></div>`
            document.getElementById('reset-filter')?.addEventListener('click', () => {
                Object.assign(state, { categoryId: '', keyword: '' })
                searchInput.value = ''
                update()
            })
        }

        function update() { syncUrl(); render() }

        document.getElementById('category-tabs').addEventListener('click', event => {
            const button = event.target.closest('button[data-category]')
            if (!button) return
            state.categoryId = button.dataset.category
            update()
        })
        document.getElementById('search-form').addEventListener('submit', event => {
            event.preventDefault()
            state.keyword = searchInput.value.trim()
            update()
        })
        sortSelect.addEventListener('change', () => { state.sort = sortSelect.value; update() })
        render()
    </script>
</body>
</html>
